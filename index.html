<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My DIY Run</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .metric {
            margin: 20px 0;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
        }

        .label {
            font-size: 16px;
            color: #666;
        }

        button {
            font-size: 20px;
            padding: 14px 30px;
            margin: 15px 5px;
            border-radius: 10px;
            border: none;
            background: #2e7d32;
            color: white;
        }

        button.running {
            background: #c62828;
        }

        button.secondary {
            background: #777;
        }

        button.danger {
            background: #c62828;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        #status {
            margin-top: 10px;
            color: #555;
        }

        #noMovement {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        #noMovement h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1>🏃 My DIY Run</h1>

    <div class="metric">
        <div class="value" id="time">00:00:00</div>
        <div class="label">TIME</div>
    </div>

    <div class="metric">
        <div class="value" id="distance">0.00</div>
        <div class="label">DISTANCE (km)</div>
    </div>

    <div class="metric">
        <div class="value" id="pace">--:--</div>
        <div class="label">AVERAGE PACE (min/km)</div>
    </div>

    <button id="runButton" onclick="toggleRun()">
        START RUN
    </button>

    <div id="status">Ready</div>

    <div id="noMovement">

        <h2>⚠️ No significant movement detected</h2>

        <p>
            This recording doesn't appear to contain
            meaningful movement.
        </p>

        <p>
            <strong>Distance:</strong>
            <span id="finalDistance">0.00</span> km
        </p>

        <p>
            <strong>Time:</strong>
            <span id="finalTime">00:00:00</span>
        </p>

        <button class="danger" onclick="discardRun()">
            DISCARD
        </button>

        <button class="secondary" onclick="saveAnyway()">
            SAVE ANYWAY
        </button>

    </div>

    <h2>KM SPLITS</h2>

    <table>
        <thead>
            <tr>
                <th>KM</th>
                <th>TIME</th>
                <th>PACE</th>
            </tr>
        </thead>

        <tbody id="splits">
        </tbody>
    </table>


<script>

let watchId = null;
let startTime = null;
let lastPosition = null;

let totalDistance = 0;
let timerInterval = null;

let lastSplitTime = 0;
let splitNumber = 1;

let isRunning = false;

let hasMovement = false;


// Minimum distance between GPS points that we will count.
// This helps reduce small GPS movements while stationary.
const MIN_MOVEMENT_METRES = 5;


// Convert degrees to radians
function toRadians(degrees) {

    return degrees * Math.PI / 180;
}


// Calculate distance between two GPS coordinates
function distanceBetween(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const dLat =
        toRadians(lat2 - lat1);

    const dLon =
        toRadians(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


// Format elapsed time
function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;

    return String(hours).padStart(2, "0") +
           ":" +
           String(minutes).padStart(2, "0") +
           ":" +
           String(secs).padStart(2, "0");
}


// Format pace
function formatPace(secondsPerKm) {

    if (
        !isFinite(secondsPerKm) ||
        secondsPerKm <= 0
    ) {
        return "--:--";
    }

    const minutes =
        Math.floor(secondsPerKm / 60);

    const seconds =
        Math.floor(secondsPerKm % 60);

    return String(minutes).padStart(2, "0") +
           ":" +
           String(seconds).padStart(2, "0");
}


// Update timer and average pace
function updateTimer() {

    if (!startTime) return;

    const elapsed =
        (Date.now() - startTime) / 1000;


    document.getElementById("time").innerText =
        formatTime(elapsed);


    // Don't show pace until we have at least
    // 100 metres of meaningful movement.
    if (totalDistance >= 100) {

        const averagePace =
            elapsed /
            (totalDistance / 1000);

        document.getElementById("pace").innerText =
            formatPace(averagePace);

    } else {

        document.getElementById("pace").innerText =
            "--:--";
    }
}


// START / STOP
function toggleRun() {

    if (isRunning) {

        stopRun();

    } else {

        startRun();
    }
}


// START RUN
function startRun() {

    if (!navigator.geolocation) {

        document.getElementById("status").innerText =
            "GPS is not available.";

        return;
    }


    isRunning = true;

    hasMovement = false;


    const button =
        document.getElementById("runButton");

    button.innerText =
        "STOP RUN";

    button.classList.add("running");


    document.getElementById("noMovement")
        .style.display = "none";


    startTime =
        Date.now();

    lastPosition = null;

    totalDistance = 0;

    lastSplitTime = 0;

    splitNumber = 1;


    document.getElementById("distance")
        .innerText = "0.00";

    document.getElementById("time")
        .innerText = "00:00:00";

    document.getElementById("pace")
        .innerText = "--:--";

    document.getElementById("splits")
        .innerHTML = "";


    document.getElementById("status")
        .innerText =
        "Getting GPS...";


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );


    watchId =
        navigator.geolocation.watchPosition(

        function(position) {

            const current =
                position.coords;


            document.getElementById("status")
                .innerText =
                "GPS accuracy: " +
                Math.round(current.accuracy) +
                " m";


            // First GPS reading
            if (lastPosition === null) {

                lastPosition = {

                    latitude:
                        current.latitude,

                    longitude:
                        current.longitude
                };

                return;
            }


            // Ignore GPS readings with poor accuracy
            if (current.accuracy > 50) {

                return;
            }


            const segmentDistance =
                distanceBetween(

                    lastPosition.latitude,
                    lastPosition.longitude,

                    current.latitude,
                    current.longitude
                );


            /*
             Ignore tiny GPS movements.

             If the phone is sitting still and GPS
             moves by only a few metres, we don't
             count that as actual movement.
            */

            if (
                segmentDistance <
                MIN_MOVEMENT_METRES
            ) {

                return;
            }


            /*
             Ignore very large jumps.

             This protects against GPS suddenly
             jumping to an incorrect location.
            */

            if (
                segmentDistance > 50
            ) {

                return;
            }


            // We have meaningful movement
            hasMovement = true;


            totalDistance +=
                segmentDistance;


            lastPosition = {

                latitude:
                    current.latitude,

                longitude:
                    current.longitude
            };


            // Display distance
            document.getElementById("distance")
                .innerText =
                (
                    totalDistance / 1000
                ).toFixed(2);


            // KM splits
            while (
                totalDistance >=
                splitNumber * 1000
            ) {

                const now =
                    Date.now();

                const elapsed =
                    (now - startTime) / 1000;


                const splitTime =
                    elapsed -
                    lastSplitTime;


                const row =
                    document.createElement("tr");


                row.innerHTML =
                    "<td>" +
                    splitNumber +
                    "</td>" +

                    "<td>" +
                    formatTime(elapsed) +
                    "</td>" +

                    "<td>" +
                    formatPace(splitTime) +
                    "</td>";


                document.getElementById("splits")
                    .appendChild(row);


                lastSplitTime =
                    elapsed;

                splitNumber++;
            }

        },


        function(error) {

            document.getElementById("status")
                .innerText =
                "GPS error: " +
                error.message;
        },


        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}


// STOP RUN
function stopRun() {

    isRunning = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    if (timerInterval !== null) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;
    }


    const elapsed =
        (Date.now() - startTime) / 1000;


    const button =
        document.getElementById("runButton");

    button.innerText =
        "START RUN";

    button.classList.remove("running");


    /*
       If we have less than 100 metres AND
       no meaningful GPS movement occurred,
       ask the user whether to discard it.
    */

    if (
        totalDistance < 100 &&
        !hasMovement
    ) {

        document.getElementById("finalDistance")
            .innerText =
            (
                totalDistance / 1000
            ).toFixed(2);


        document.getElementById("finalTime")
            .innerText =
            formatTime(elapsed);


        document.getElementById("noMovement")
            .style.display =
            "block";


        document.getElementById("status")
            .innerText =
            "Recording needs review.";

        return;
    }


    document.getElementById("status")
        .innerText =
        "Run finished.";

    updateTimer();
}


// DISCARD RUN
function discardRun() {

    totalDistance = 0;

    startTime = null;

    lastPosition = null;

    hasMovement = false;


    document.getElementById("distance")
        .innerText =
        "0.00";

    document.getElementById("time")
        .innerText =
        "00:00:00";

    document.getElementById("pace")
        .innerText =
        "--:--";

    document.getElementById("splits")
        .innerHTML =
        "";


    document.getElementById("noMovement")
        .style.display =
        "none";


    document.getElementById("status")
        .innerText =
        "Recording discarded.";
}


// SAVE ANYWAY
function saveAnyway() {

    document.getElementById("noMovement")
        .style.display =
        "none";

    document.getElementById("status")
        .innerText =
        "Run saved.";

    updateTimer();
}

</script>

</body>
</html>
