<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My DIY Run</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .metric {
            margin: 20px 0;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
        }

        .label {
            font-size: 16px;
            color: #666;
        }

        button {
            font-size: 20px;
            padding: 14px 30px;
            margin: 15px 0;
            border-radius: 10px;
            border: none;
            background: #2e7d32;
            color: white;
        }

        button.running {
            background: #c62828;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        #status {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>🏃 My DIY Run</h1>

    <div class="metric">
        <div class="value" id="time">00:00:00</div>
        <div class="label">TIME</div>
    </div>

    <div class="metric">
        <div class="value" id="distance">0.00</div>
        <div class="label">DISTANCE (km)</div>
    </div>

    <div class="metric">
        <div class="value" id="pace">--:--</div>
        <div class="label">AVERAGE PACE (min/km)</div>
    </div>

    <button id="runButton" onclick="toggleRun()">START RUN</button>

    <div id="status">Ready</div>

    <h2>KM SPLITS</h2>

    <table>
        <thead>
            <tr>
                <th>KM</th>
                <th>TIME</th>
                <th>PACE</th>
            </tr>
        </thead>

        <tbody id="splits">
        </tbody>
    </table>


<script>

let watchId = null;
let startTime = null;
let lastPosition = null;
let totalDistance = 0;
let timerInterval = null;

let lastSplitTime = 0;
let splitNumber = 1;

let isRunning = false;


// Convert degrees to radians
function toRadians(degrees) {
    return degrees * Math.PI / 180;
}


// Calculate distance between two GPS coordinates
function distanceBetween(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = toRadians(lat2 - lat1);
    const dLon = toRadians(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


// Format elapsed time as HH:MM:SS
function formatTime(seconds) {

    seconds = Math.floor(seconds);

    const hours = Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;

    return String(hours).padStart(2, "0") + ":" +
           String(minutes).padStart(2, "0") + ":" +
           String(secs).padStart(2, "0");
}


// Format pace as MM:SS
function formatPace(secondsPerKm) {

    if (!isFinite(secondsPerKm) || secondsPerKm <= 0) {
        return "--:--";
    }

    const minutes =
        Math.floor(secondsPerKm / 60);

    const seconds =
        Math.floor(secondsPerKm % 60);

    return String(minutes).padStart(2, "0") + ":" +
           String(seconds).padStart(2, "0");
}


// Update timer and average pace
function updateTimer() {

    if (!startTime) return;

    const elapsed =
        (Date.now() - startTime) / 1000;

    document.getElementById("time").innerText =
        formatTime(elapsed);

    if (totalDistance > 0) {

        const averagePace =
            elapsed / (totalDistance / 1000);

        document.getElementById("pace").innerText =
            formatPace(averagePace);
    }
}


// Single START / STOP button
function toggleRun() {

    if (isRunning) {

        stopRun();

    } else {

        startRun();
    }
}


// START RUN
function startRun() {

    if (!navigator.geolocation) {

        document.getElementById("status").innerText =
            "GPS is not available on this device.";

        return;
    }

    isRunning = true;

    const button =
        document.getElementById("runButton");

    button.innerText = "STOP RUN";
    button.classList.add("running");

    startTime = Date.now();

    lastPosition = null;
    totalDistance = 0;

    lastSplitTime = 0;
    splitNumber = 1;

    document.getElementById("distance").innerText =
        "0.00";

    document.getElementById("time").innerText =
        "00:00:00";

    document.getElementById("pace").innerText =
        "--:--";

    document.getElementById("splits").innerHTML =
        "";

    document.getElementById("status").innerText =
        "Getting GPS...";

    timerInterval =
        setInterval(updateTimer, 1000);


    watchId =
        navigator.geolocation.watchPosition(

        function(position) {

            const current =
                position.coords;


            document.getElementById("status").innerText =
                "GPS accuracy: " +
                Math.round(current.accuracy) +
                " m";


            // First GPS reading
            if (lastPosition === null) {

                lastPosition = {

                    latitude:
                        current.latitude,

                    longitude:
                        current.longitude
                };

                return;
            }


            // Ignore inaccurate readings
            if (current.accuracy > 50) {

                return;
            }


            const segmentDistance =
                distanceBetween(

                    lastPosition.latitude,
                    lastPosition.longitude,

                    current.latitude,
                    current.longitude
                );


            // Ignore very large GPS jumps
            if (segmentDistance > 50) {

                return;
            }


            totalDistance +=
                segmentDistance;


            lastPosition = {

                latitude:
                    current.latitude,

                longitude:
                    current.longitude
            };


            // Display distance
            document.getElementById("distance").innerText =
                (totalDistance / 1000).toFixed(2);


            // Check for completed kilometres
            while (
                totalDistance >=
                splitNumber * 1000
            ) {

                const now =
                    Date.now();

                const elapsed =
                    (now - startTime) / 1000;


                const splitTime =
                    elapsed - lastSplitTime;


                const row =
                    document.createElement("tr");


                row.innerHTML =
                    "<td>" +
                    splitNumber +
                    "</td>" +

                    "<td>" +
                    formatTime(elapsed) +
                    "</td>" +

                    "<td>" +
                    formatPace(splitTime) +
                    "</td>";


                document.getElementById("splits")
                    .appendChild(row);


                lastSplitTime =
                    elapsed;

                splitNumber++;
            }

        },


        function(error) {

            document.getElementById("status").innerText =
                "GPS error: " +
                error.message;
        },


        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
}


// STOP RUN
function stopRun() {

    isRunning = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    if (timerInterval !== null) {

        clearInterval(
            timerInterval
        );

        timerInterval = null;
    }


    const button =
        document.getElementById("runButton");

    button.innerText =
        "START RUN";

    button.classList.remove("running");


    document.getElementById("status").innerText =
        "Run finished.";

    updateTimer();
}

</script>

</body>
</html>
