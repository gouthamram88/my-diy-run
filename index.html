<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>My DIY Run</title>
  <style>
    body { font-family: system-ui, -apple-system, Roboto, Arial; padding: 1rem; max-width:640px; margin:auto; }
    .big { font-size: 1.25rem; }
    button { margin: .5rem .25rem; padding: .5rem 1rem; }
    #splits { margin-top: 1rem; }
    .split { margin-bottom: .25rem; }
    .small { font-size: .9rem; color: #555 }
    .muted { color: #666 }
  </style>
</head>
<body>
  <h1>🏃 My DIY Run</h1>
  <p class="small">A simple in-browser running tracker. Requires HTTPS or localhost and location permission.</p>

  <div>
    <button id="startBtn">Start GPS</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="exportBtn" disabled>Export GPX</button>
  </div>

  <p id="status">Not started</p>

  <div id="stats" style="display:none">
    <p class="big" id="distance">Distance: 0.00 km</p>
    <p class="big" id="speed">Speed: 0.0 km/h</p>
    <p class="big" id="pace">Pace: --:-- /km</p>
    <p id="coords">Lat: — Lon: —</p>
    <div id="splits"><strong>Splits</strong></div>
  </div>

  <script>
    // Utilities
    function haversineMeters(lat1, lon1, lat2, lon2) {
      const toRad = x => x * Math.PI / 180;
      const R = 6371000; // meters
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function formatTimeSecondsToPace(secPerKm) {
      if (!isFinite(secPerKm) || secPerKm <= 0) return '--:--';
      const m = Math.floor(secPerKm / 60);
      const s = Math.round(secPerKm % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function isoTime(ts) { return new Date(ts).toISOString(); }

    // State
    let watchId = null;
    let points = []; // {lat, lon, time, accuracy}
    let totalMeters = 0;
    let nextKmMark = 1000; // meters
    let splits = [];

    // UI refs
    const statusEl = document.getElementById('status');
    const distanceEl = document.getElementById('distance');
    const speedEl = document.getElementById('speed');
    const paceEl = document.getElementById('pace');
    const coordsEl = document.getElementById('coords');
    const statsEl = document.getElementById('stats');
    const splitsEl = document.getElementById('splits');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const exportBtn = document.getElementById('exportBtn');

    startBtn.addEventListener('click', startTracking);
    stopBtn.addEventListener('click', stopTracking);
    exportBtn.addEventListener('click', exportGPX);

    function startTracking() {
      if (!('geolocation' in navigator)) {
        statusEl.textContent = 'Geolocation not supported by this browser.';
        return;
      }

      // Reset
      points = [];
      totalMeters = 0;
      nextKmMark = 1000;
      splits = [];
      splitsEl.innerHTML = '<strong>Splits</strong>';

      statsEl.style.display = 'block';
      statusEl.textContent = 'Requesting GPS permission...';

      // Start watching
      watchId = navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true,
        maximumAge: 1000,    // allow cached up to 1s
        timeout: 10000
      });

      startBtn.disabled = true;
      stopBtn.disabled = false;
      exportBtn.disabled = true;
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      statusEl.textContent = 'Stopped';
      startBtn.disabled = false;
      stopBtn.disabled = true;
      exportBtn.disabled = points.length === 0;
    }

    function onPosition(pos) {
      // Read values
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy; // meters
      const timestamp = pos.timestamp || Date.now();

      // Basic filtering
      const MAX_ACCEPTABLE_ACCURACY = 60; // meters, tune as required
      if (typeof accuracy === 'number' && accuracy > MAX_ACCEPTABLE_ACCURACY) {
        statusEl.textContent = `Ignoring inaccurate reading (±${Math.round(accuracy)} m).`;
        return;
      }

      // First point
      const point = { lat, lon, time: timestamp, accuracy };
      if (points.length === 0) {
        points.push(point);
        statusEl.textContent = 'Tracking...';
        coordsEl.textContent = `Lat: ${lat.toFixed(6)} Lon: ${lon.toFixed(6)} (±${accuracy ? accuracy.toFixed(0) : '—'} m)`;
        updateStats();
        return;
      }

      // Compute delta to last accepted point
      const last = points[points.length - 1];
      const dtSeconds = (timestamp - last.time) / 1000;
      if (dtSeconds <= 0) return; // ignore bad timestamps

      const dMeters = haversineMeters(last.lat, last.lon, lat, lon);

      // Ignore tiny jumps due to GPS jitter
      const MIN_JUMP_METERS = 3; // ignore moves smaller than this
      if (dMeters < MIN_JUMP_METERS) {
        // still update last time/accuracy if you want, but skip distance
        coordsEl.textContent = `Lat: ${lat.toFixed(6)} Lon: ${lon.toFixed(6)} (±${accuracy ? accuracy.toFixed(0) : '—'} m)`;
        return;
      }

      // Accept point
      points.push(point);
      totalMeters += dMeters;

      // Speed (m/s) -> km/h
      const speedMs = dMeters / dtSeconds;
      const speedKmh = speedMs * 3.6;

      // Pace: time per km in seconds (approx based on instantaneous speed)
      const paceSecPerKm = speedMs > 0 ? 1000 / speedMs : Infinity;

      // Check km splits
      if (totalMeters >= nextKmMark) {
        // Find time at which the km was crossed by interpolating between last and current point
        const lastTotalBefore = totalMeters - dMeters;
        const needed = nextKmMark - lastTotalBefore;
        const r = needed / dMeters;
        const timeAtKmMs = last.time + r * (timestamp - last.time);

        const prevKmTime = splits.length === 0 ? points[0].time : splits[splits.length - 1].timeAtKm;
        const splitSec = (timeAtKmMs - prevKmTime) / 1000;

        splits.push({
          km: splits.length + 1,
          splitSec: Math.round(splitSec),
          timeAtKm: timeAtKmMs
        });

        // display split
        const splitEl = document.createElement('div');
        splitEl.className = 'split';
        splitEl.textContent = `KM ${splits.length}: ${formatTimeSecondsToPace(splitSec)} (${Math.round(splitSec)}s)`;
        splitsEl.appendChild(splitEl);

        nextKmMark += 1000;
      }

      // Update UI
      coordsEl.textContent = `Lat: ${lat.toFixed(6)} Lon: ${lon.toFixed(6)} (±${accuracy ? accuracy.toFixed(0) : '—'} m)`;
      distanceEl.textContent = `Distance: ${(totalMeters / 1000).toFixed(2)} km`;
      speedEl.textContent = `Speed: ${speedKmh.toFixed(1)} km/h`;
      paceEl.textContent = `Pace: ${formatTimeSecondsToPace(paceSecPerKm)} /km`;
      statusEl.textContent = `Tracking — ${points.length} points, last Δ ${dMeters.toFixed(1)} m`;

      // Optionally persist to localStorage periodically
      // localStorage.setItem('run.points', JSON.stringify(points));
    }

    function onError(err) {
      switch (err.code) {
        case err.PERMISSION_DENIED:
          statusEl.textContent = 'Permission denied. Please allow location access.';
          break;
        case err.POSITION_UNAVAILABLE:
          statusEl.textContent = 'Position unavailable.';
          break;
        case err.TIMEOUT:
          statusEl.textContent = 'Position request timed out.';
          break;
        default:
          statusEl.textContent = 'GPS error: ' + (err.message || 'unknown');
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    function updateStats() {
      distanceEl.textContent = `Distance: ${(totalMeters / 1000).toFixed(2)} km`;
      speedEl.textContent = `Speed: -- km/h`;
      paceEl.textContent = `Pace: --:-- /km`;
    }

    // GPX export (simple)
    function exportGPX() {
      if (points.length === 0) return;
      const name = `my-diy-run-${new Date().toISOString()}`;
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx version="1.1" creator="my-diy-run" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpx += `<metadata><time>${isoTime(points[0].time)}</time></metadata>\n`;
      gpx += `<trk><name>${name}</name><trkseg>\n`;
      for (const p of points) {
        gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${isoTime(p.time)}</time></trkpt>\n`;
      }
      gpx += `</trkseg></trk>\n</gpx>`;

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name}.gpx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // If we have saved points in localStorage we could restore (not implemented by default)
  </script>
</body>
</html>
